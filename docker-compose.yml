services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: human-learning-platform:latest
    container_name: human-learning-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    restart: unless-stopped
